# DipLock за nginx: TLS и публичный адрес даёт облако Abacus AI,
# этот server — внутренний слой с basic auth и лимитами.
# Подключение: sudo cp deploy/nginx.conf /etc/nginx/conf.d/diplock.conf
# Пароль:      sudo htpasswd -c /etc/nginx/.htpasswd diplock
server {
    # default_server обязателен: ingress облака не передаёт Host, поэтому
    # совпадения по server_name нет. В /etc/nginx/nginx.conf у блока «READY»
    # (`root /var/www/html`) `default_server` нужно снять, иначе он выигрывает.
    listen 80 default_server;
    server_name diplock.abacusai.cloud 44b313054.abacusai.cloud;

    # EDF до 200 МБ (api/uploads.py) + запас на multipart.
    client_max_body_size 210m;
    # Синхронный /analyze и генерация ассетов дольше дефолтных 60 с.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    auth_basic "DipLock";
    # nginx в облаке работает под `user ubuntu` (nginx.conf, строка 1), а не
    # www-data: файл паролей должен быть читаем этим пользователем.
    #   sudo htpasswd -c /etc/nginx/.htpasswd diplock
    #   sudo chown root:ubuntu /etc/nginx/.htpasswd && sudo chmod 640 /etc/nginx/.htpasswd
    auth_basic_user_file /etc/nginx/.htpasswd;

    # /health открыт: эндпоинт не раскрывает данных, его опрашивает внешний
    # мониторинг (B4). Без proxy_pass nginx отдал бы 404 из root.
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Схема API выключена (ENABLE_DOCS=false): 404 и без пароля, чтобы проверка
    # «/docs → 404» не зависела от наличия учётных данных.
    location = /docs {
        auth_basic off;
        return 404;
    }

    location = /openapi.json {
        auth_basic off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
