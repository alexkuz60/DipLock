# DipLock за nginx: TLS и публичный адрес даёт облако Abacus AI,
# этот server — внутренний слой с basic auth и лимитами.
# Подключение: sudo cp deploy/nginx.conf /etc/nginx/conf.d/diplock.conf
# Пароль:      sudo htpasswd -c /etc/nginx/.htpasswd diplock
server {
    listen 80;
    # Явные имена: в nginx.conf облака уже есть `listen 80 default_server`
    # (страница READY), поэтому совпадение идёт по заголовку Host.
    server_name diplock.abacusai.cloud 44b313054.abacusai.cloud;

    # EDF до 200 МБ (api/uploads.py) + запас на multipart.
    client_max_body_size 210m;
    # Синхронный /analyze и генерация ассетов дольше дефолтных 60 с.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    auth_basic "DipLock";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
