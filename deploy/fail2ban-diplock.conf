# fail2ban: перебор basic auth DipLock (B5).
# Копия: sudo cp deploy/fail2ban-diplock.conf /etc/fail2ban/jail.d/diplock.local
# Фильтр nginx-http-auth штатный: ловит «user "diplock": password mismatch»
# и «user "diplock" was not found» в /var/log/nginx/error.log.
# Почему не limit_req: 10 r/m на все запросы задушили бы опрос задач UI,
# а привязать лимит к неудачной авторизации nginx не умеет (limit_req идёт
# до auth_basic). fail2ban банит именно источник 401.
[diplock-nginx-http-auth]
enabled = true
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 5
findtime = 10m
bantime = 1h
