<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DipLock">
  <!--
    Иконка приложения DipLock для ярлыка рабочего стола (Linux, hicolor).
    Тот же мозг Lucide, что и в frontend/public/favicon.svg, на холсте 128×128.
    Комментарий намеренно стоит ПОСЛЕ корневого тега: gdk-pixbuf определяет
    формат SVG по первым ~100 байтам файла, длинная преамбула до <svg> ломает
    отрисовку иконки в GNOME (пустая плитка).
  -->
  <rect width="128" height="128" rx="28" fill="#121a24" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#2c3a4d" stroke-width="4" />
