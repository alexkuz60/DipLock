# DipLock — конфигурация alembic (одна БД, 4.2).
#
# Запуск из каталога backend/:
#   venv/bin/alembic upgrade head                 # поднять схему до последней миграции
#   venv/bin/alembic revision --autogenerate -m "..."  # новая миграция после правки моделей
# URL БД здесь намеренно НЕ задан: env.py берёт sqlalchemy.url из программного
# вызова (init_db подставляет URL движка) или из settings.database_url.

[alembic]
# Путь к скриптам миграций относительно этого файла (%(here)s не зависит от CWD).
script_location = %(here)s/alembic

# sys.path добавляет текущий каталог (backend/) — env.py импортирует app.*.
prepend_sys_path = .
path_separator = os

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Текстовые файлы проекта (докстринги) — на русском; имена файлов — ASCII по шаблону.
