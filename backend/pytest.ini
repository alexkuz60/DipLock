[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
addopts = --strict-markers
markers =
    integration: тесты на локальных научных данных (~/mne_data) или реальном EDF
filterwarnings =
    ignore::DeprecationWarning