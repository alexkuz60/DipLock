[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
addopts = --strict-markers
markers =
    integration: тесты на локальных научных данных (~/mne_data) или реальном EDF
# Предупреждения (в т.ч. DeprecationWarning MNE — дрейф API, docs/rules/safety.md)
# НЕ подавляем глобально: устаревание библиотек должно быть видно в выводе pytest и CI.
# Шумные источники подавляются точечно по месту (filterwarnings с указанием модуля).
