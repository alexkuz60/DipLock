# DipLock — конфигурация линтера (ruff) и проверки типов (mypy) для backend.
#
# Запуск (из каталога backend/):
#   venv/bin/ruff check app tests scripts
#   venv/bin/mypy app
# Оба входа обязательны в CI (.github/workflows/ci.yml), правила — docs/rules/tests.md.

[tool.ruff]
target-version = "py312"
# Строки не жёстче 100 символов: докстринги на русском (E501 в наборе правил ниже не включён,
# но ориентир задаём, чтобы новые правки не разъезжались).
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: импорты (повторы, не на своём месте)
    "E7",  # pycodestyle: сравнения, except, переменные
    "E9",  # pycodestyle: синтаксические ошибки рантайма
    "F",   # pyflakes: неиспользуемые импорты/переменные, переопределения
    "I",   # isort: порядок импортов
    "UP",  # pyupgrade: синтаксис под python 3.12
    "B",   # flake8-bugbear: типовые ловушки
    "SIM", # flake8-simplify
    "RUF", # правила самого ruff
    "ASYNC", # flake8-async: блокирующие вызовы в async-коде
    "S",   # flake8-bandit: очевидные риски
]
ignore = [
    # FastAPI: Depends()/Query() в значениях по умолчанию — норма фреймворка.
    "B008",
    # Формальные придирки к мутабельному кэшу: часть модулей держит LRU-кэши на уровне модуля
    # осознанно (см. docs/rules/data-and-caches.md).
    "B019",
    # Тексты проекта — на русском: кириллица в строках и комментариях — норма, а не опечатка
    # латиницей (RUF001-003 ловят «С»/«с»/«о» и подобные пары).
    "RUF001",
    "RUF002",
    "RUF003",
    # Раздача статики (main.py) и отдача ассетов: `os.path`/`stat` микросекундные и стоят внутри
    # async-обработчиков Starlette осознанно. Долгие файловые операции остаются под запретом —
    # их ловят ASYNC230 (чтение/запись целиком) и правила docs/rules/safety.md.
    "ASYNC240",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — рабочий инструмент pytest, их количество не является дефектом.
"tests/**" = ["S101"]
# conftest: каталоги данных уводятся в tmp ДО импорта настроек — импорты ниже
# os.environ стоят здесь осознанно (иначе тесты пишут в рабочий data/).
"tests/conftest.py" = ["S101", "E402"]
# Тесты путей и защиты от обхода каталогов намеренно работают с «подозрительными» путями
# (/tmp/..., /tmp/../../etc/passwd.edf) — это контракт, а не небезопасный код.
"tests/test_api_contract.py" = ["S101", "S108"]
# Скрипты — точки входа для ручного запуска: печать в stdout ожидаема.
"scripts/**" = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Научный стек (mne/nibabel/scipy) поставляется без стабов — их отсутствие не ошибка.
ignore_missing_imports = true
# Проверяем тела функций и без аннотаций: без этого «страховка» пропускает самые частые ошибки.
check_untyped_defs = true
# Возвраты None там, где по аннотации значение: чаще всего реальный дефект.
warn_no_return = true
# Импорт ради побочного эффекта (регистрация роутеров, моделей) — не ошибка.
implicit_reexport = true

[[tool.mypy.overrides]]
# Контракт роутов FastAPI: обработчики принимают `Response` и прокидывают его в помощники.
# Ослабление точечное и описано правилом — docs/rules/api-jobs.md.
module = ["app.api.routes"]
warn_return_any = false
