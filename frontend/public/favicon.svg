<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка приложения DipLock: мозг в акцентном цвете темы.

  Геометрия — иконка Brain из набора Lucide (ISC), того же набора, что и иконки
  рейла разделов; сетка — родные 24×24, вписана в 32×32 полем 4 px.
  Цвета повторяют токены тёмной темы (frontend/src/styles/index.css):
  подложка — токен bg-1 (#121a24), рамка — border (#2c3a4d), штрих — accent
  (#4da3ff). SVG масштабируется браузером до любого размера, поэтому .ico-дубль
  не нужен.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="DipLock — мозг">
  <rect width="32" height="32" rx="7" fill="#121a24" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2c3a4d" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#4da3ff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
    <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
    <path d="M6 18a4 4 0 0 1-1.967-.516" />
    <path d="M19.967 17.484A4 4 0 0 1 18 18" />
  </g>
</svg>
